<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>期待値チェッカー</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #111418; --card: #1b2027; --line: #2c333d; --text: #e9edf2; --sub: #9aa4b2;
    --accent: #4da3ff; --good: #2ecc71; --warn: #f1c40f; --bad: #e74c3c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tabs button { flex: 1 1 30%; padding: 12px 6px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--sub); font-size: 15px; font-weight: 600; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .row { margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  .row > label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  label { font-size: 13px; color: var(--sub); }
  .field { margin-bottom: 12px; }
  .field label { display: block; margin-bottom: 4px; }
  input[type=number], textarea { width: 100%; background: #0d1014; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; font-size: 22px; }
  textarea { font-size: 15px; min-height: 90px; font-family: ui-monospace, monospace; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { flex: 1 1 auto; padding: 10px 8px; background: #161a20; color: var(--sub); border: 1px solid var(--line);
    border-radius: 8px; font-size: 14px; }
  .seg button.on { background: #2a3a4f; color: var(--text); border-color: var(--accent); font-weight: 600; }
  .step { display: flex; gap: 6px; margin-top: 6px; }
  .step button { flex: 1; padding: 10px 0; border-radius: 8px; border: 1px solid var(--line); background: #222831; color: var(--text); font-size: 14px; }
  /* 入力中も判定が見えるよう画面上部に固定 */
  #verdict { position: sticky; top: 0; z-index: 1; box-shadow: 0 0 0 4px var(--bg); }
  .verdict { font-size: 26px; font-weight: 800; text-align: center; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
  .v-good { background: linear-gradient(rgba(46,204,113,.15), rgba(46,204,113,.15)) var(--bg); color: var(--good); }
  .v-warn { background: linear-gradient(rgba(241,196,15,.15), rgba(241,196,15,.15)) var(--bg); color: var(--warn); }
  .v-bad  { background: linear-gradient(rgba(231,76,60,.12), rgba(231,76,60,.12)) var(--bg); color: var(--bad); }
  .v-none { background: #222831; color: var(--sub); font-size: 18px; }
  .stop { font-size: 14px; background: #222831; border-radius: 8px; padding: 10px; margin-bottom: 12px; line-height: 1.5; }
  .stop b { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .big td:last-child { font-size: 20px; }
  .note { font-size: 12px; color: var(--sub); line-height: 1.6; }
  details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 input { font-size: 17px; padding: 9px; }
  .btn { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: #222831; color: var(--text); font-size: 14px; margin-top: 8px; }
</style>
</head>

// 前兆抜けの行はゾーン+1に置き、値が下がる場合はゾーン直前まで前の値を据え置く
function evText(rows, col) {
  const out = [];
  for (const r of rows) {
    const v = r[col], prev = out[out.length - 1];
    if (r[4]) { if (prev && v < prev[1]) out.push([r[0], prev[1]]); out.push([r[0] + 1, v]); }
    else out.push([r[0], v]);
  }
  return out.map(p => p.join(',')).join('\n');
}
function hokutoEv() {
  const ev = {};
  for (const sit of ['normal', 'reset']) ['eq', '56m', '56c'].forEach((rate, i) => ev[`abeshi_${rate}_${sit}`] = evText(HOKUTO_EV[sit], i + 1));
  return ev;
}
// リコリコはG数別の円期待値が未公開のため、状況別の狙い目G数だけ持つ（全交換率共通）
function lycoAim() {
  const base = { normal: 480, kakenuke: 70, reset: 70, czfail: 0, upperat: 0 };
  const aim = {};
  for (const sit in base) for (const rate of ['eq', '56m', '56c']) aim[`at_${rate}_${sit}`] = base[sit];
  return aim;
}

// 期待値表をまとめて作る。specs: [カウンターid, 状況id, 列の交換率id[], [[x, 値...], ...]]
function mkEv(specs) {
  const ev = {};
  for (const [cid, sit, cols, rows] of specs)
    cols.forEach((rate, i) => ev[`${cid}_${rate}_${sit}`] = rows.map(r => `${r[0]},${r[i + 1]}`).join('\n'));
  return ev;
}

let state = load();

function buildCfg(k, o = {}) {
  const m = structuredClone(DEFAULTS[k]);
  for (const f of ['coin', 'threshold', 'memo']) if (o[f] != null) m[f] = o[f];
  for (const ak in o.aim || {}) { if (o.aim[ak] === null) delete m.aim[ak]; else m.aim[ak] = o.aim[ak]; }
  Object.assign(m.ev, o.ev);
  m.situations.forEach(s => { if (o.stop?.[s.id] != null) s.stop = o.stop[s.id]; });
  m.counters.forEach(c => Object.assign(c.ceil, o.ceil?.[c.id]));
  return m;
}

function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  const s = { tab: 'lyco', rate: 'eq', sit: {}, input: {}, over: {}, ...(saved || {}) };
  if (!DEFAULTS[s.tab]) s.tab = 'lyco';
  if (!RATES.some(r => r.id === s.rate)) s.rate = 'eq';
  s.cfg = {};
  for (const k in DEFAULTS) s.cfg[k] = buildCfg(k, s.over[k]);
  return s;
}
function save() {
  const { cfg, ...rest } = state;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(rest)); } catch (e) {}
}
// ユーザーの変更を over に記録して cfg を作り直す
function setOver(fn) {
  const o = state.over[state.tab] || (state.over[state.tab] = {});
  fn(o);
  state.cfg[state.tab] = buildCfg(state.tab, o);
}

const yen = n => { const r = Math.round(n); return (r < 0 ? '-' : '+') + '¥' + Math.abs(r).toLocaleString(); };
const sitOf = () => {
  const m = state.cfg[state.tab], id = state.sit[state.tab];
  return m.situations.some(s => s.id === id) ? id : m.situations[0].id;
};
const key = cid => `${cid}_${state.rate}_${sitOf()}`;

// "G,円" の行から線形補間で期待値を出す
function evFromTable(text, x) {
  if (!text) return null;
  const pts = text.split('\n').map(l => l.trim().replace(/[，、]/g, ',').split(/[,\s]+/).map(Number)).filter(p => p.length >= 2 && !isNaN(p[0]) && !isNaN(p[1])).sort((a, b) => a[0] - b[0]);
  if (!pts.length) return null;
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (x <= pts[i][0]) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0); }
  }
  return pts[pts.length - 1][1];
}

function judge(m, c, val) {
  const ceil = c.ceil[sitOf()];
  if (val == null) return { ceil, level: 'none', empty: true };
  const remain = Math.max(0, ceil - val);
  const cost = remain / m.coin * 1000;
  const aim = m.aim[key(c.id)];
  const ev = evFromTable(m.ev[key(c.id)], val);
  let level = 'none';
  if (ev != null) level = ev >= m.threshold ? 'good' : ev >= 0 ? 'warn' : 'bad';
  else if (aim != null) level = val >= aim ? 'good' : val >= aim - 100 ? 'warn' : 'bad';
  return { ceil, remain, cost, aim, ev, level };
}

function render() {
  document.getElementById('tabs').innerHTML = Object.entries(state.cfg).map(([k, m]) =>
    `<button class="${state.tab === k ? 'on' : ''}" data-tab="${k}">${m.name}</button>`).join('');
  const m = state.cfg[state.tab];
  const inp = state.input[state.tab] || (state.input[state.tab] = {});
  const sit = m.situations.find(s => s.id === sitOf());

  let html = `<div class="card">
    <div class="row"><label>交換率</label><div class="seg">
      ${RATES.map(r => `<button data-rate="${r.id}" class="${state.rate === r.id ? 'on' : ''}">${r.label}</button>`).join('')}</div></div>
    <div class="row"><label>状況</label><div class="seg">
      ${m.situations.map(s => `<button data-sit="${s.id}" class="${sit.id === s.id ? 'on' : ''}">${s.label}</button>`).join('')}</div></div>
  </div>`;

  for (const c of m.counters) {
    html += `<div class="card">
      <div class="field"><label>${c.label}</label>
        <input type="number" inputmode="numeric" data-in="${c.id}" value="${inp[c.id] ?? ''}" placeholder="0">
        <div class="step">${[-100, -10, 10, 50, 100].map(d => `<button data-step="${c.id}" data-d="${d}">${d > 0 ? '+' : ''}${d}</button>`).join('')}</div>
      </div>
      <div id="res-${c.id}"></div></div>`;
  }
  html = `<div id="verdict"></div><div class="stop"><b>やめどき：</b><span id="stop"></span></div>` + html;

  html += `<div class="card"><details><summary>機種メモ</summary><p class="note" id="memo" style="white-space:pre-wrap"></p></details></div>`;
  html += settingsHtml(m, sit);
  html += `<p class="note" id="foot"></p>`;
  // 作り直しても開いていた折りたたみ（機種メモ・設定）は開いたままにする
  const open = [...document.querySelectorAll('#app details')].map(x => x.open);
  document.getElementById('app').innerHTML = html;
  document.querySelectorAll('#app details').forEach((x, i) => x.open = !!open[i]);
  update();
}

// 判定と結果欄だけ書き換える（入力欄は作り直さないのでカーソルやキーボードが乱れない）
function update() {
  const m = state.cfg[state.tab], inp = state.input[state.tab];
  document.getElementById('stop').textContent = m.situations.find(s => s.id === sitOf()).stop;
  document.getElementById('memo').textContent = m.memo;
  document.getElementById('foot').textContent = `${m.full}／コイン持ち ${m.coin}G/1000円で計算。期待値表がある場合は「${yen(m.threshold)}以上で◎、0円以上で△」、ない場合は狙い目G数で判定。数値は解析サイトの設定1理論値で、勝ちを保証するものではありません。`;
  const results = m.counters.map(c => {
    const raw = inp[c.id];
    const r = judge(m, c, raw === '' || raw == null || isNaN(Number(raw)) ? null : Math.max(0, Number(raw)));
    const el = document.getElementById(`res-${c.id}`);
    if (r.empty) { el.innerHTML = `<table><tr><td>天井</td><td>${r.ceil}${c.unit}</td></tr></table>`; return r; }
    el.innerHTML = `<table>
      ${r.ev != null ? `<tr class="big"><td>期待値</td><td style="color:var(--${r.level})">${yen(r.ev)}</td></tr>` : ''}
      <tr><td>天井</td><td>${r.ceil}${c.unit}</td></tr>
      <tr><td>天井まで</td><td>${r.remain}${c.unit}</td></tr>
      <tr><td>天井までの投資目安${c.unit === 'G' ? '' : '（1あべし=1G換算・多め）'}</td><td>${yen(r.cost).replace('+', '')}</td></tr>
      ${r.aim != null ? `<tr><td>狙い目</td><td>${r.aim}${c.unit}〜</td></tr>` : ''}
    </table>`;
    return r;
  });
  const order = { good: 3, warn: 2, bad: 1, none: 0 };
  const best = results.reduce((a, b) => order[b.level] > order[a.level] ? b : a).level;
  const allEmpty = results.every(r => r.empty);
  const label = allEmpty ? 'ゲーム数を入力' : { good: '◎ 狙い目', warn: '△ 微妙', bad: '× 見送り', none: '判定データなし' }[best];
  const v = document.getElementById('verdict');
  v.className = `verdict v-${best}`;
  v.textContent = label;
}

function settingsHtml(m, sit) {
  const rateName = RATES.find(r => r.id === state.rate).label;
  let h = `<div class="card"><details><summary>設定（${rateName}・${sit.label}）</summary>
    <div class="grid2" style="margin-top:10px">
      <div><label>コイン持ち（G/1000円）</label><input type="number" step="0.1" inputmode="decimal" data-cfg="coin" value="${m.coin}"></div>
      <div><label>◎にする期待値（円）</label><input type="number" inputmode="numeric" data-cfg="threshold" value="${m.threshold}"></div>
    </div>
    <div class="field" style="margin-top:8px"><label>やめどき（${sit.label}）</label><textarea data-stop="${sit.id}" style="min-height:60px">${esc(sit.stop)}</textarea></div>`;
  for (const c of m.counters) {
    const k = key(c.id);
    h += `<p style="margin:14px 0 6px;font-weight:600">${c.label}</p>
      <div class="grid2">
        <div><label>天井（${sit.label}）</label><input type="number" inputmode="numeric" data-ceil="${c.id}" value="${c.ceil[sit.id]}"></div>
        <div><label>狙い目</label><input type="number" inputmode="numeric" data-aim="${k}" value="${m.aim[k] ?? ''}" placeholder="なし"></div>
      </div>
      <div class="field" style="margin-top:8px"><label>期待値表 1行に「${c.unit},円」</label>
        <textarea data-ev="${k}" placeholder="例:\n600,-1500\n800,500\n1000,3000">${esc(m.ev[k] || '')}</textarea></div>`;
  }
  h += `<div class="field"><label>機種メモ</label><textarea data-cfg="memo" style="min-height:160px">${esc(m.memo)}</textarea></div>
    <button class="btn" data-resetcfg="1">この機種の設定を初期値に戻す</button></details></div>`;
  return h;
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let confirmReset = false;
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (t.classList.contains('on')) return; // 選択中のボタンは何もしない
  if (d.tab) state.tab = d.tab;
  else if (d.rate) state.rate = d.rate;
  else if (d.sit) state.sit[state.tab] = d.sit;
  else if (d.step) {
    const inp = state.input[state.tab];
    inp[d.step] = Math.max(0, (Number(inp[d.step]) || 0) + Number(d.d));
    document.querySelector(`[data-in="${d.step}"]`).value = inp[d.step];
    save(); update();
    return;
  } else if (d.resetcfg) {
    if (!confirmReset) {
      confirmReset = true; t.textContent = 'もう一度押すと初期値に戻します';
      setTimeout(() => { confirmReset = false; t.textContent = 'この機種の設定を初期値に戻す'; }, 3000);
      return;
    }
    delete state.over[state.tab];
    state.cfg[state.tab] = buildCfg(state.tab);
  } else return;
  confirmReset = false;
  save(); render();
});

document.addEventListener('input', e => {
  const t = e.target, d = t.dataset, v = t.value, n = parseFloat(v);
  if (d.in) state.input[state.tab][d.in] = v;
  else if (d.cfg === 'memo') setOver(o => o.memo = v);
  else if (d.cfg) {
    // 入力途中の空欄や不正値は無視（0 は有効。コイン持ちだけは 0 以下を不可）
    if (v === '' || isNaN(n) || (d.cfg === 'coin' && n <= 0)) return;
    setOver(o => o[d.cfg] = n);
  }
  else if (d.stop) setOver(o => (o.stop ||= {})[d.stop] = v);
  else if (d.ceil) { if (isNaN(n)) return; setOver(o => ((o.ceil ||= {})[d.ceil] ||= {})[sitOf()] = n); }
  else if (d.aim) setOver(o => (o.aim ||= {})[d.aim] = v === '' || isNaN(n) ? null : n);
  else if (d.ev) setOver(o => (o.ev ||= {})[d.ev] = v);
  else return;
  save(); update();
});

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
